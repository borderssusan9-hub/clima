<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=BioRhyme:wght@200..800&family=Butterfly+Kids&family=Caveat:wght@400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playpen+Sans:wght@100..800&family=Roboto:ital,wght@0,100..900;1,100..900&family=Silkscreen:wght@400;700&display=swap"
        rel="stylesheet">
    
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <title>Clima App</title>
</head>
<body>
    <div class="clima-app">
    <header>
        <form class="search-form" id="search-form">
            <input type="search" 
            placeholder="Enter a city..." 
            required 
            class="search-form-input"
            id="search-form-input"   />
            <input type="submit" value="Search" class="search-form-button" />
        </form>
    </header>
    <main>
        <div class="clima-app-data">
        <div>
<h1 class="clima-app-city" id="city"></h1>
<p class="clima-app-details">
    <span id="time"></span>
    <span id="description"></span>
    <br />
    Humidity: <strong id="humidity"></strong>, Wind: <strong id="wind-speed"></strong> 
</p> 
</div>
<div class="clima-app-temperature-container">
<div id="icon"></div>
        <div class="clima-app-temperature" id="temperature"></div>
        <div class="clima-app-unit">°C</div>
</div>
 </div>
    </main>
    <footer>This project is coded by <a href="https://github.com/borderssusan9-hub/clima" target="_blank">Susan Borders</a>, is <a href="https://github.com/borderssusan9-hub/clima" target="_blank">open-sourced onGithub</a> and <a href="https://clima-meteo-app.netlify.app" target="_blank">hosted on Netlify</a></footer>
    </div>
    <script src="src/index.js"></script>
</body>
</html>
